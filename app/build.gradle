def verifyReleaseAdMobConfiguration = tasks.register("verifyReleaseAdMobConfiguration") {
    doLast {
        def appIdPattern = ~/ca-app-pub-\d{16}~\d{10}/
        def unitIdPattern = ~/ca-app-pub-\d{16}\/\d{10}/
        if (!(releaseAdMobAppId ==~ appIdPattern) || releaseAdMobAppId == debugAdMobAppId) {
            throw new GradleException(
                "Release AdMob App ID is missing, invalid, or a test ID. " +
                    "Set MATA_ADMOB_APP_ID in Gradle properties."
            )
        }
        if (!(releaseBannerAdUnitId ==~ unitIdPattern) || releaseBannerAdUnitId == debugBannerAdUnitId) {
            throw new GradleException(
                "Release AdMob banner unit ID is missing, invalid, or a test ID. " +
                    "Set MATA_ADMOB_BANNER_AD_UNIT_ID in Gradle properties."
            )
        }
    }
}

def verifyReleaseLegalUrls = tasks.register("verifyReleaseLegalUrls") {
    group = "verification"
    description = "Verifies the required public legal-document URLs."
    doLast {
        def expectedUrls = [
            privacyPolicy: [releasePrivacyPolicyUrl, "/mata/privacy"],
            terms: [releaseTermsUrl, "/mata/terms"],
        ]
        expectedUrls.each { label, configuration ->
            def configuredUrl = configuration[0]
            def expectedPath = configuration[1]
            def parsedUrl
            try {
                parsedUrl = new URI(configuredUrl)
            } catch (Exception ignored) {
                throw new GradleException("Release ${label} URL is invalid: ${configuredUrl}")
            }
            if (parsedUrl.scheme != "https" ||
                parsedUrl.host != "mochisofts.com" ||
                parsedUrl.path != expectedPath ||
                parsedUrl.query != null ||
                parsedUrl.fragment != null) {
                throw new GradleException(
                    "Release ${label} URL is missing or invalid. " +
                        "Set MATA_${label == 'privacyPolicy' ? 'PRIVACY_POLICY' : 'TERMS'}_URL " +
                        "to the approved HTTPS URL."
                )
            }
        }
    }
}

def configuredReleaseNamespace = android.namespace
def configuredReleaseApplicationId = android.defaultConfig.applicationId
def verifyReleaseVersionConfiguration = tasks.register("verifyReleaseVersionConfiguration") {
    group = "verification"
    description = "Verifies the public application ID and semantic release version."
    doLast {
        if (configuredReleaseNamespace != "com.mochisofts.mata" ||
            configuredReleaseApplicationId != "com.mochisofts.mata") {
            throw new GradleException("Release namespace and application ID must be com.mochisofts.mata.")
        }
        if (!(releaseVersionName ==~ /\d+\.\d+\.\d+/)) {
            throw new GradleException(
                "Release versionName must use MAJOR.MINOR.PATCH, but was ${releaseVersionName}."
            )
        }
        if (releaseVersionCode < 1) {
            throw new GradleException("Release versionCode must be a positive integer.")
        }
    }
}

def verifyReleaseSigningConfiguration = tasks.register("verifyReleaseSigningConfiguration") {
    group = "verification"
    description = "Verifies whether Upload Key signing is required and fully configured."
    inputs.property("uploadSigningConfigured", uploadSigningConfigured)
    inputs.property("requireUploadSigning", requireUploadSigning)
    doLast {
        if (requireUploadSigning && !uploadSigningConfigured) {
            throw new GradleException(
                "A publishable Release requires Upload Key signing. Set all four MATA_UPLOAD_* " +
                    "properties and build with --no-configuration-cache."
            )
        }
    }
}

tasks.configureEach { task ->
    if (task.name == "preReleaseBuild") {
        task.dependsOn(
            verifyReleaseAdMobConfiguration,
            verifyReleaseLegalUrls,
            verifyReleaseSigningConfiguration,
            verifyReleaseVersionConfiguration,
        )
    }
}

def releaseGitCommit = providers.environmentVariable("GITHUB_SHA")
    .orElse(providers.gradleProperty("MATA_GIT_COMMIT"))
    .orElse(
        providers.exec {
            workingDir(rootDir)
            commandLine("git", "rev-parse", "HEAD")
        }.standardOutput.asText.map { it.trim() }
    )
def releaseBuildTimestamp = providers.gradleProperty("MATA_BUILD_TIMESTAMP")
    .orElse(providers.provider { java.time.Instant.now().toString() })
def releaseSbom = layout.buildDirectory.file("outputs/sbom/release-sbom.cdx.json")
def releaseBundle = layout.buildDirectory.file("outputs/bundle/release/app-release.aab")
def releaseMapping = layout.buildDirectory.file("outputs/mapping/release/mapping.txt")
def releaseLicenseList = layout.buildDirectory.file(
    "generated/aboutLibraries/release/res/raw/aboutlibraries.json"
)
def releaseManifest = layout.buildDirectory.file(
    "intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml"
)
def releaseMetadata = layout.buildDirectory.file(
    "outputs/release-metadata/release-metadata.json"
)
def releaseRootPath = rootProject.layout.projectDirectory.asFile.absolutePath

tasks.named("cyclonedxDirectBom", org.cyclonedx.gradle.CyclonedxDirectTask) {
    description = "Generates a CycloneDX SBOM for the Release runtime dependency graph."
    includeConfigs = ["releaseRuntimeClasspath"]
    skipConfigs = []
    testConfigs = []
    projectType = org.cyclonedx.model.Component.Type.APPLICATION
    componentGroup = "com.mochisofts"
    componentName = "MATA"
    componentVersion = releaseVersionName
    includeBomSerialNumber = false
    includeLicenseText = false
    includeMetadataResolution = true
    includeBuildEnvironment = false
    includeBuildSystem = false
    jsonOutput = releaseSbom
    xmlOutput.convention((org.gradle.api.file.RegularFile) null)
    inputs.property("mataBuildTimestamp", releaseBuildTimestamp)
    doLast {
        def timestamp
        try {
            timestamp = java.time.Instant.parse(releaseBuildTimestamp.get()).toString()
        } catch (Exception ignored) {
            throw new GradleException("MATA_BUILD_TIMESTAMP must be an ISO-8601 UTC timestamp.")
        }
        def output = releaseSbom.get().asFile
        def bom = new groovy.json.JsonSlurper().parse(output)
        bom.metadata.timestamp = timestamp
        output.setText(
            groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(bom)) + "\n",
            "UTF-8",
        )
    }
}

tasks.register("generateReleaseArtifactMetadata") {
    group = "verification"
    description = "Builds the Release AAB and records signing, checksums, and release identity."
    dependsOn("bundleRelease", "cyclonedxDirectBom", verifyReleaseVersionConfiguration)
    inputs.files(releaseBundle, releaseMapping, releaseLicenseList, releaseManifest, releaseSbom)
    inputs.property("applicationId", "com.mochisofts.mata")
    inputs.property("versionName", releaseVersionName)
    inputs.property("versionCode", releaseVersionCode)
    inputs.property("gitCommit", releaseGitCommit)
    inputs.property("buildTimestamp", releaseBuildTimestamp)
    inputs.property("uploadSigningConfigured", uploadSigningConfigured)
    outputs.file(releaseMetadata)

    doLast {
        def commit = releaseGitCommit.get()
        if (!(commit ==~ /[0-9a-fA-F]{40,64}/)) {
            throw new GradleException("Release Git commit must be a full hexadecimal commit ID.")
        }
        def timestamp
        try {
            timestamp = java.time.Instant.parse(releaseBuildTimestamp.get()).toString()
        } catch (Exception ignored) {
            throw new GradleException("MATA_BUILD_TIMESTAMP must be an ISO-8601 UTC timestamp.")
        }

        def requiredArtifacts = [
            [type: "androidAppBundle", file: releaseBundle.get().asFile],
            [type: "r8Mapping", file: releaseMapping.get().asFile],
            [type: "openSourceLicenses", file: releaseLicenseList.get().asFile],
            [type: "mergedManifest", file: releaseManifest.get().asFile],
            [type: "cycloneDxSbom", file: releaseSbom.get().asFile],
        ]
        requiredArtifacts.each { artifact ->
            if (!artifact.file.isFile()) {
                throw new GradleException("Release artifact is missing: ${artifact.file}")
            }
        }
        def sha256 = { File file ->
            def digest = java.security.MessageDigest.getInstance("SHA-256")
            file.withInputStream { input ->
                def buffer = new byte[8192]
                int count
                while ((count = input.read(buffer)) != -1) {
                    digest.update(buffer, 0, count)
                }
            }
            digest.digest().encodeHex().toString()
        }
        def signerCertificateSha256 = { File file ->
            def fingerprints = [] as Set
            def jar = new java.util.jar.JarFile(file, true)
            try {
                def entries = jar.entries()
                while (entries.hasMoreElements()) {
                    def entry = entries.nextElement()
                    if (entry.directory || entry.name.startsWith("META-INF/")) {
                        continue
                    }
                    jar.getInputStream(entry).withCloseable { input ->
                        def buffer = new byte[8192]
                        while (input.read(buffer) != -1) {
                            // Reading each entry fully causes JarFile to verify and expose signers.
                        }
                    }
                    entry.codeSigners?.each { signer ->
                        def certificate = signer.signerCertPath.certificates[0]
                        def digest = java.security.MessageDigest.getInstance("SHA-256")
                        fingerprints.add(digest.digest(certificate.encoded).encodeHex().toString())
                    }
                }
            } finally {
                jar.close()
            }
            fingerprints.toList().sort()
        }
        def signerFingerprints = signerCertificateSha256(releaseBundle.get().asFile)
        if (uploadSigningConfigured && signerFingerprints.isEmpty()) {
            throw new GradleException("Upload Key signing was configured but the AAB is unsigned.")
        }
        if (!uploadSigningConfigured && !signerFingerprints.isEmpty()) {
            throw new GradleException("The CI verification AAB must not contain a signing certificate.")
        }
        def rootPath = java.nio.file.Paths.get(releaseRootPath)
        def metadata = [
            schemaVersion: 3,
            publishable: uploadSigningConfigured,
            purpose: uploadSigningConfigured
                ? "Upload Key signed candidate; all remaining release gates still apply."
                : "CI verification only; production publication requires Upload Key signing.",
            applicationId: "com.mochisofts.mata",
            versionName: releaseVersionName,
            versionCode: releaseVersionCode,
            gitCommit: commit.toLowerCase(java.util.Locale.ROOT),
            buildTimestamp: timestamp,
            signing: [
                method: uploadSigningConfigured ? "uploadKey" : "none",
                certificateSha256: signerFingerprints,
            ],
            artifacts: requiredArtifacts.collect { artifact ->
                [
                    type: artifact.type,
                    path: rootPath.relativize(artifact.file.toPath()).toString().replace('\\', '/'),
                    bytes: artifact.file.length(),
                    sha256: sha256(artifact.file),
                ]
            },
        ]
        def output = releaseMetadata.get().asFile
        output.parentFile.mkdirs()
        output.setText(
            groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(metadata)) + "\n",
            "UTF-8",
        )
    }
}

tasks.register("verifyReleaseManifestSecurity") {
    group = "verification"
    description = "Verifies the merged release manifest security surface."
    dependsOn("processReleaseManifest")
    inputs.file(
        layout.buildDirectory.file(
            "intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml"
        )
    )

    doLast {
        def factory = javax.xml.parsers.DocumentBuilderFactory.newInstance()
        factory.namespaceAware = true
        factory.setFeature("http://apache.org/xml/features/disallow-doctype-decl", true)
        factory.setFeature("http://xml.org/sax/features/external-general-entities", false)
        factory.setFeature("http://xml.org/sax/features/external-parameter-entities", false)
        def manifest = factory.newDocumentBuilder().parse(inputs.files.singleFile)
        def androidNamespace = "http://schemas.android.com/apk/res/android"
        def androidAttribute = { node, name -> node.getAttributeNS(androidNamespace, name) }
        def elements = { tag ->
            def nodes = manifest.getElementsByTagName(tag)
            (0..<nodes.length).collect { nodes.item(it) }
        }

        def applications = elements("application")
        if (applications.size() != 1) {
            throw new GradleException(
                "Expected one application element, found ${applications.size()}."
            )
        }
        def application = applications[0]
        def requiredApplicationAttributes = [
            allowBackup: "false",
            dataExtractionRules: "@xml/data_extraction_rules",
            fullBackupContent: "false",
            networkSecurityConfig: "@xml/network_security_config",
            usesCleartextTraffic: "false",
        ]
        requiredApplicationAttributes.each { name, expected ->
            def actual = androidAttribute(application, name)
            if (actual != expected) {
                throw new GradleException(
                    "Release manifest android:${name} must be ${expected}, but was ${actual}."
                )
            }
        }
        if (androidAttribute(application, "debuggable") == "true") {
            throw new GradleException("Release application must not be debuggable.")
        }

        def manifestChildren = manifest.documentElement.childNodes
        def actualPermissions = (0..<manifestChildren.length)
            .collect { manifestChildren.item(it) }
            .findAll {
                it.nodeType == org.w3c.dom.Node.ELEMENT_NODE &&
                    it.nodeName.startsWith("uses-permission")
            }
            .collect { androidAttribute(it, "name") }
            .toSet()
        def approvedPermissions = [
            "android.permission.ACCESS_NETWORK_STATE",
            "android.permission.FOREGROUND_SERVICE",
            "android.permission.INTERNET",
            "android.permission.POST_NOTIFICATIONS",
            "android.permission.READ_BASIC_PHONE_STATE",
            "android.permission.RECEIVE_BOOT_COMPLETED",
            "android.permission.SCHEDULE_EXACT_ALARM",
            "android.permission.WAKE_LOCK",
            "com.android.vending.BILLING",
            "com.google.android.gms.permission.AD_ID",
            "com.mochisofts.mata.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION",
        ] as Set
        if (actualPermissions != approvedPermissions) {
            throw new GradleException(
                "Release permissions changed. Added: ${actualPermissions - approvedPermissions}; " +
                    "removed: ${approvedPermissions - actualPermissions}."
            )
        }

        def exportedComponents = ["activity", "activity-alias", "provider", "receiver", "service"]
            .collectMany { tag ->
                elements(tag)
                    .findAll { androidAttribute(it, "exported") == "true" }
                    .collect {
                        "${tag}:${androidAttribute(it, "name")}:${androidAttribute(it, "permission")}"
                    }
            }
            .toSet()
        def approvedExportedComponents = [
            "activity:com.mochisofts.mata.app.MainActivity:",
            "receiver:androidx.profileinstaller.ProfileInstallReceiver:android.permission.DUMP",
            "receiver:androidx.work.impl.diagnostics.DiagnosticsReceiver:android.permission.DUMP",
            "receiver:com.mochisofts.mata.widget.TodayTodoWidgetReceiver:",
            "service:androidx.glance.appwidget.GlanceRemoteViewsService:android.permission.BIND_REMOTEVIEWS",
            "service:androidx.work.impl.background.systemjob.SystemJobService:android.permission.BIND_JOB_SERVICE",
        ] as Set
        if (exportedComponents != approvedExportedComponents) {
            throw new GradleException(
                "Release exported components changed. Added: " +
                    "${exportedComponents - approvedExportedComponents}; removed: " +
                    "${approvedExportedComponents - exportedComponents}."
            )
        }
    }
}
