name: Android Release Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-verification
  cancel-in-progress: true

jobs:
  verify_release:
    name: Release and performance verification
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Reject committed secrets and signing files
        shell: bash
        run: |
          if git ls-files | grep -E '\.(jks|keystore|p12|pfx)$|(^|/)(google-services|service-account).*\.json$'; then
            echo "Signing material or service credentials must not be committed."
            exit 1
          fi
          if git grep -I -n -E -- 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|gh[pousr]_[A-Za-z0-9]{30,}|AIza[0-9A-Za-z_-]{35}' -- .; then
            echo "A value matching a private key or access-token pattern was found."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Set build timestamp
        shell: bash
        run: echo "ORG_GRADLE_PROJECT_MATA_BUILD_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Verify release and performance builds
        env:
          ORG_GRADLE_PROJECT_MATA_ADMOB_APP_ID: ca-app-pub-0000000000000001~0000000001
          ORG_GRADLE_PROJECT_MATA_ADMOB_BANNER_AD_UNIT_ID: ca-app-pub-0000000000000001/0000000001
          ORG_GRADLE_PROJECT_MATA_PRIVACY_POLICY_URL: https://mochisofts.com/mata/privacy
          ORG_GRADLE_PROJECT_MATA_TERMS_URL: https://mochisofts.com/mata/terms
        run: >-
          ./gradlew
          :app:lintRelease
          :app:generateReleaseArtifactMetadata
          :app:verifyReleaseManifestSecurity
          :app:assembleBenchmark
          :benchmark:assembleBenchmarkRelease
          --no-daemon
          --stacktrace

      - name: Upload release verification artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mata-release-verification-${{ github.sha }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/release-metadata/release-metadata.json
            app/build/outputs/mapping/release/mapping.txt
            app/build/generated/aboutLibraries/release/res/raw/aboutlibraries.json
            app/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml
          if-no-files-found: error
          retention-days: 365
