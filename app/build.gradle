plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.baselineprofile)
    alias(libs.plugins.compose.compiler)
    alias(libs.plugins.ksp)
    alias(libs.plugins.hilt)
    alias(libs.plugins.kotlin.serialization)
}

def debugAdMobAppId = "ca-app-pub-3940256099942544~3347511713"
def debugBannerAdUnitId = "ca-app-pub-3940256099942544/9214589741"
def releaseAdMobAppId = providers.gradleProperty("MATA_ADMOB_APP_ID").orElse("").get()
def releaseBannerAdUnitId = providers.gradleProperty("MATA_ADMOB_BANNER_AD_UNIT_ID").orElse("").get()

android {
    namespace 'com.mochisofts.mata'
    compileSdk {
        version = release(37) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.mochisofts.mata"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            manifestPlaceholders.admobAppId = debugAdMobAppId
            buildConfigField "String", "ADMOB_APP_ID", "\"${debugAdMobAppId}\""
            buildConfigField "String", "ADMOB_BANNER_AD_UNIT_ID", "\"${debugBannerAdUnitId}\""
        }
        release {
            optimization {
                enable true
            }
            manifestPlaceholders.admobAppId = releaseAdMobAppId ?: "missing-admob-app-id"
            buildConfigField "String", "ADMOB_APP_ID", "\"${releaseAdMobAppId}\""
            buildConfigField "String", "ADMOB_BANNER_AD_UNIT_ID", "\"${releaseBannerAdUnitId}\""
        }
        benchmark {
            initWith buildTypes.release
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
            manifestPlaceholders.admobAppId = debugAdMobAppId
            buildConfigField "String", "ADMOB_APP_ID", "\"${debugAdMobAppId}\""
            buildConfigField "String", "ADMOB_BANNER_AD_UNIT_ID", "\"${debugBannerAdUnitId}\""
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    sourceSets {
        androidTest.assets.srcDir "$projectDir/schemas"
    }
    lint {
        abortOnError = true
        checkDependencies = true
        checkReleaseBuilds = true
    }
}

ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}

dependencies {
    def composeBom = platform(libs.androidx.compose.bom)
    implementation composeBom
    androidTestImplementation composeBom

    implementation libs.androidx.activity.compose
    implementation libs.androidx.core.ktx
    implementation libs.androidx.core.splashscreen
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.androidx.navigation.compose
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.icons.extended
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.material
    implementation libs.androidx.room.runtime
    implementation libs.androidx.room.ktx
    implementation libs.androidx.room.paging
    implementation libs.androidx.paging.runtime
    implementation libs.androidx.paging.compose
    implementation libs.androidx.work.runtime
    implementation libs.androidx.glance.appwidget
    implementation libs.androidx.glance.material3
    implementation libs.google.play.billing
    implementation libs.google.mobile.ads.next.gen
    implementation libs.google.user.messaging.platform
    implementation libs.androidx.profileinstaller
    implementation libs.androidx.datastore.preferences
    implementation libs.androidx.hilt.navigation.compose
    implementation libs.hilt.android
    implementation libs.kotlinx.serialization.core
    implementation libs.kotlinx.serialization.json
    ksp libs.androidx.room.compiler
    ksp libs.hilt.compiler

    debugImplementation libs.androidx.compose.ui.tooling
    debugImplementation libs.androidx.compose.ui.test.manifest

    testImplementation libs.junit
    testImplementation libs.kotlinx.coroutines.test
    testImplementation libs.androidx.room.testing
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.room.testing
    androidTestImplementation libs.androidx.paging.testing
    androidTestImplementation libs.androidx.compose.ui.test.junit4

    baselineProfile project(':benchmark')
}

baselineProfile {
    automaticGenerationDuringBuild false
    saveInSrc true
}

def verifyReleaseAdMobConfiguration = tasks.register("verifyReleaseAdMobConfiguration") {
    doLast {
        def appIdPattern = ~/ca-app-pub-\d{16}~\d{10}/
        def unitIdPattern = ~/ca-app-pub-\d{16}\/\d{10}/
        if (!(releaseAdMobAppId ==~ appIdPattern) || releaseAdMobAppId == debugAdMobAppId) {
            throw new GradleException(
                "Release AdMob App ID is missing, invalid, or a test ID. " +
                    "Set MATA_ADMOB_APP_ID in Gradle properties."
            )
        }
        if (!(releaseBannerAdUnitId ==~ unitIdPattern) || releaseBannerAdUnitId == debugBannerAdUnitId) {
            throw new GradleException(
                "Release AdMob banner unit ID is missing, invalid, or a test ID. " +
                    "Set MATA_ADMOB_BANNER_AD_UNIT_ID in Gradle properties."
            )
        }
    }
}

tasks.configureEach { task ->
    if (task.name == "preReleaseBuild") {
        task.dependsOn(verifyReleaseAdMobConfiguration)
    }
}
