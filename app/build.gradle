def debugAdMobAppId = "ca-app-pub-3940256099942544~3347511713"
def debugBannerAdUnitId = "ca-app-pub-3940256099942544/9214589741"
def releaseAdMobAppId = providers.gradleProperty("MATA_ADMOB_APP_ID").orElse("").get()
def releaseBannerAdUnitId = providers.gradleProperty("MATA_ADMOB_BANNER_AD_UNIT_ID").orElse("").get()
def debugPrivacyPolicyUrl = "https://mochisofts.com/mata/privacy"
def debugTermsUrl = "https://mochisofts.com/mata/terms"
def releasePrivacyPolicyUrl = providers.gradleProperty("MATA_PRIVACY_POLICY_URL").orElse("").get()
def releaseTermsUrl = providers.gradleProperty("MATA_TERMS_URL").orElse("").get()
def releaseVersionCode = 1
def releaseVersionName = "1.0.0"
def uploadStoreFilePath = providers.gradleProperty("MATA_UPLOAD_STORE_FILE").orElse("").get()
def uploadStorePassword = providers.gradleProperty("MATA_UPLOAD_STORE_PASSWORD").orElse("").get()
def uploadKeyAlias = providers.gradleProperty("MATA_UPLOAD_KEY_ALIAS").orElse("").get()
def uploadKeyPassword = providers.gradleProperty("MATA_UPLOAD_KEY_PASSWORD").orElse("").get()
def requireUploadSigningValue = providers.gradleProperty("MATA_REQUIRE_UPLOAD_SIGNING")
    .orElse("false")
    .get()
if (!(requireUploadSigningValue ==~ /(?i:true|false)/)) {
    throw new GradleException("MATA_REQUIRE_UPLOAD_SIGNING must be true or false.")
}
def requireUploadSigning = requireUploadSigningValue.toBoolean()
def uploadSigningValues = [
    uploadStoreFilePath,
    uploadStorePassword,
    uploadKeyAlias,
    uploadKeyPassword,
]
def uploadSigningConfigured = uploadSigningValues.every { !it.isEmpty() }
def uploadSigningPartiallyConfigured = uploadSigningValues.any { !it.isEmpty() } &&
    !uploadSigningConfigured
if (uploadSigningPartiallyConfigured) {
    throw new GradleException(
        "Upload Key signing is partially configured. Set all four MATA_UPLOAD_* properties or none."
    )
}
def uploadStoreFile = uploadSigningConfigured ? new File(uploadStoreFilePath) : null
if (uploadSigningConfigured) {
    if (gradle.startParameter.configurationCacheRequested) {
        throw new GradleException(
            "Upload Key signing requires --no-configuration-cache so signing secrets are not " +
                "retained in the project configuration cache."
        )
    }
    if (!uploadStoreFile.isAbsolute()) {
        throw new GradleException("MATA_UPLOAD_STORE_FILE must be an absolute path.")
    }
    if (!uploadStoreFile.isFile()) {
        throw new GradleException("The configured Upload Key keystore file does not exist.")
    }
    def repositoryPath = rootProject.projectDir.canonicalFile.toPath()
    if (uploadStoreFile.canonicalFile.toPath().startsWith(repositoryPath)) {
        throw new GradleException("The Upload Key keystore must be stored outside the repository.")
    }
}

android {
    namespace 'com.mochisofts.mata'
    compileSdk {
        version = release(37) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.mochisofts.mata"
        minSdk 26
        targetSdk 36
        versionCode releaseVersionCode
        versionName releaseVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (uploadSigningConfigured) {
            create("upload") {
                storeFile uploadStoreFile
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            manifestPlaceholders.admobAppId = debugAdMobAppId
            buildConfigField "String", "ADMOB_APP_ID", "\"${debugAdMobAppId}\""
            buildConfigField "String", "ADMOB_BANNER_AD_UNIT_ID", "\"${debugBannerAdUnitId}\""
            buildConfigField "String", "PRIVACY_POLICY_URL", "\"${debugPrivacyPolicyUrl}\""
            buildConfigField "String", "TERMS_URL", "\"${debugTermsUrl}\""
        }
        release {
            optimization {
                enable true
            }
            manifestPlaceholders.admobAppId = releaseAdMobAppId ?: "missing-admob-app-id"
            buildConfigField "String", "ADMOB_APP_ID", "\"${releaseAdMobAppId}\""
            buildConfigField "String", "ADMOB_BANNER_AD_UNIT_ID", "\"${releaseBannerAdUnitId}\""
            buildConfigField "String", "PRIVACY_POLICY_URL", "\"${releasePrivacyPolicyUrl}\""
            buildConfigField "String", "TERMS_URL", "\"${releaseTermsUrl}\""
            if (uploadSigningConfigured) {
                signingConfig signingConfigs.getByName("upload")
            }
        }
        benchmark {
            initWith buildTypes.release
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
            manifestPlaceholders.admobAppId = debugAdMobAppId
            buildConfigField "String", "ADMOB_APP_ID", "\"${debugAdMobAppId}\""
            buildConfigField "String", "ADMOB_BANNER_AD_UNIT_ID", "\"${debugBannerAdUnitId}\""
            buildConfigField "String", "PRIVACY_POLICY_URL", "\"${debugPrivacyPolicyUrl}\""
            buildConfigField "String", "TERMS_URL", "\"${debugTermsUrl}\""
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    sourceSets {
        androidTest.assets.srcDir "$projectDir/schemas"
    }
    lint {
        abortOnError = true
        checkDependencies = true
        checkReleaseBuilds = true
    }
}

