name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  repository_security:
    name: Repository security checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Reject committed secrets and signing files
        shell: bash
        run: |
          if git ls-files | grep -E '\.(jks|keystore|p12|pfx)$|(^|/)(google-services|service-account).*\.json$'; then
            echo "Signing material or service credentials must not be committed."
            exit 1
          fi
          if git grep -I -n -E -- 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|gh[pousr]_[A-Za-z0-9]{30,}|AIza[0-9A-Za-z_-]{35}' -- .; then
            echo "A value matching a private key or access-token pattern was found."
            exit 1
          fi

  android_verification:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debug verification
            tasks: testDebugUnitTest lintDebug assembleDebug
            admob_app_id: ""
            admob_banner_id: ""
            privacy_policy_url: ""
            terms_url: ""
            upload_release_artifacts: false
          - name: Release verification
            tasks: :app:lintRelease :app:generateReleaseArtifactMetadata :app:verifyReleaseManifestSecurity
            admob_app_id: ca-app-pub-0000000000000001~0000000001
            admob_banner_id: ca-app-pub-0000000000000001/0000000001
            privacy_policy_url: https://mochisofts.com/mata/privacy
            terms_url: https://mochisofts.com/mata/terms
            upload_release_artifacts: true
          - name: Performance APK verification
            tasks: :app:assembleBenchmark :benchmark:assembleBenchmarkRelease
            admob_app_id: ""
            admob_banner_id: ""
            privacy_policy_url: ""
            terms_url: ""
            upload_release_artifacts: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Set build timestamp
        shell: bash
        run: echo "ORG_GRADLE_PROJECT_MATA_BUILD_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Run ${{ matrix.name }}
        env:
          ORG_GRADLE_PROJECT_MATA_ADMOB_APP_ID: ${{ matrix.admob_app_id }}
          ORG_GRADLE_PROJECT_MATA_ADMOB_BANNER_AD_UNIT_ID: ${{ matrix.admob_banner_id }}
          ORG_GRADLE_PROJECT_MATA_PRIVACY_POLICY_URL: ${{ matrix.privacy_policy_url }}
          ORG_GRADLE_PROJECT_MATA_TERMS_URL: ${{ matrix.terms_url }}
        run: ./gradlew ${{ matrix.tasks }} --no-daemon --stacktrace

      - name: Verify Release evidence
        if: matrix.upload_release_artifacts
        run: node tools/release/verify-readiness.mjs --artifacts

      - name: Upload Release verification artifacts
        if: matrix.upload_release_artifacts && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: mata-release-verification-${{ github.sha }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/release-metadata/release-metadata.json
            app/build/outputs/release-metadata/release-readiness.json
            app/build/outputs/mapping/release/mapping.txt
            app/build/generated/aboutLibraries/release/res/raw/aboutlibraries.json
            app/build/outputs/sbom/release-sbom.cdx.json
            app/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml
          if-no-files-found: error
          retention-days: 365

  verify:
    name: Test, lint, and build
    if: ${{ always() }}
    needs:
      - repository_security
      - android_verification
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Confirm all verification jobs passed
        env:
          REPOSITORY_SECURITY_RESULT: ${{ needs.repository_security.result }}
          ANDROID_VERIFICATION_RESULT: ${{ needs.android_verification.result }}
        shell: bash
        run: |
          if [[ "$REPOSITORY_SECURITY_RESULT" != "success" || "$ANDROID_VERIFICATION_RESULT" != "success" ]]; then
            echo "One or more verification jobs did not succeed."
            echo "Repository security: $REPOSITORY_SECURITY_RESULT"
            echo "Android verification: $ANDROID_VERIFICATION_RESULT"
            exit 1
          fi
