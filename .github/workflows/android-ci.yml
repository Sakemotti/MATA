name: Android CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Test, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Verify Android project
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon --stacktrace

      - name: Reject committed secrets and signing files
        shell: bash
        run: |
          if git ls-files | grep -E '\.(jks|keystore|p12|pfx)$|(^|/)(google-services|service-account).*\.json$'; then
            echo "Signing material or service credentials must not be committed."
            exit 1
          fi
          if git grep -I -n -E -- 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|gh[pousr]_[A-Za-z0-9]{30,}|AIza[0-9A-Za-z_-]{35}' -- .; then
            echo "A value matching a private key or access-token pattern was found."
            exit 1
          fi

      - name: Verify release configuration
        env:
          ORG_GRADLE_PROJECT_MATA_ADMOB_APP_ID: ca-app-pub-0000000000000001~0000000001
          ORG_GRADLE_PROJECT_MATA_ADMOB_BANNER_AD_UNIT_ID: ca-app-pub-0000000000000001/0000000001
        run: >-
          ./gradlew
          :app:lintRelease
          :app:assembleRelease
          :app:verifyReleaseManifestSecurity
          --no-daemon
          --stacktrace

      - name: Verify performance test APKs
        run: >-
          ./gradlew
          :app:assembleBenchmark
          :benchmark:assembleBenchmarkRelease
          --no-daemon
          --stacktrace
